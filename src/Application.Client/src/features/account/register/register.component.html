<div
  class="card bg-base-100 w-1/2 mx-auto flex flex-col p-4 rounded-lg shadow-lg"
>
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>

  <div class="card-body w-full">
    <ul class="steps">
      <li class="step step-primary">Credentials</li>
      <li class="step" [class.step-primary]="currentStep() === 2">Profile</li>
      <li class="step" [class.step-primary]="currentStep() === 3">About</li>
    </ul>

    @if(currentStep() === 1){

    <form
      [formGroup]="credentialsForm"
      autocomplete="off"
      class="flex flex-col gap-4 w-full steps"
    >
      <app-text-input class="mt-2" label="Name" formControlName="fullName" />
      <app-text-input label="Email" formControlName="email" />
      <app-text-input
        label="Password"
        formControlName="password"
        type="password"
      />
      <app-text-input
        label="Confirm Password"
        formControlName="passwordConfirmed"
        type="password"
      />
      <div class="flex justify-end gap-3 mt-4">
        <button type="button" (click)="cancel()" class="btn">Cancel</button>
        <button
          type="button"
          (click)="nextStep()"
          class="btn btn-primary"
          [disabled]="!credentialsForm.valid"
        >
          Next
        </button>
      </div>
    </form>

    } @else if (currentStep() === 2) {

    <form
      autocomplete="off"
      [formGroup]="profileForm"
      class="flex flex-col gap-4 w-full steps"
    >
      <app-text-input
        label="Date of Birth"
        [maxDate]="getMaxDate()"
        formControlName="dateOfBirth"
        type="date"
        class="mt-2"
      />
      <app-text-input label="City" formControlName="city" />
      <app-text-input label="Country" formControlName="country" />
      <div class="flex items-center gap-4">
        <div class="font-semibold">Gender:</div>
        <label class="flex gap-3 items-center">
          <span>Male</span>
          <input
            type="radio"
            formControlName="gender"
            value="male"
            class="radio radio-primary"
          />
        </label>
        <label class="flex gap-3 items-center">
          <span>Female</span>
          <input
            type="radio"
            formControlName="gender"
            value="female"
            class="radio radio-primary"
          />
        </label>
        <label class="flex gap-3 items-center">
          <span>Not informed</span>
          <input
            type="radio"
            formControlName="gender"
            value="not informed"
            class="radio radio-primary"
          />
        </label>
      </div>
      <div class="flex justify-end gap-3 mt-4">
        <button type="button" (click)="prevStep()" class="btn">Back</button>
        <button
          type="button"
          (click)="nextStep()"
          class="btn btn-primary"
          [disabled]="!profileForm.valid"
        >
          Next
        </button>
      </div>
    </form>

    } @else if (currentStep() === 3) {

    <form
      autocomplete="off"
      [formGroup]="aboutForm"
      class="flex flex-col gap-4 w-full steps"
    >
      <app-textarea-input
        label="Looking For"
        formControlName="lookingFor"
        [maxCharacters]="1000"
      />
      <app-textarea-input
        label="Introduction"
        formControlName="introduction"
        [maxCharacters]="2000"
      />
      <app-textarea-input
        label="Interests"
        formControlName="interests"
        [maxCharacters]="1000"
      />
      <div class="flex justify-end gap-3 mt-4">
        <button type="button" (click)="prevStep()" class="btn">Back</button>
        <button
          type="button"
          (click)="register()"
          class="btn btn-primary"
          [disabled]="!aboutForm.valid"
        >
          Register
        </button>
      </div>
    </form>

    }
  </div>
</div>

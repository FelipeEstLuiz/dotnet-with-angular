@if(!memberService.editMode()){ @if(photos() ; as photos){ @if(photos.length >
0){
<div class="grid grid-cols-4 auto-rows-min gap-3 p-5 h-[65vh] overflow-auto">
  @for(photo of photos; track photo.id){
  <div class="relative">
    <img
      src="{{ photo.url }}"
      alt="photo of member"
      class="w-full rounded-lg"
    />
    @if(sameUserMember){
    <app-star-button
      [disable]="isSamePhoto(photo)"
      [selected]="isSamePhoto(photo)"
      (clickEvent)="setMainPhoto(photo)"
      class="absolute top-1 right-1"
    />
    <app-delete-button
      [disable]="isSamePhoto(photo)"
      (clickEvent)="deletePhoto(photo.id)"
      class="absolute top-1 left-1"
    />
    }
  </div>
  }
</div>
} @else {
<div class="text-center text-gray-500">No photos available</div>
} }} @else {
<app-image-upload (uploadFile)="uploadImage($event)" [loading]="loading()" />
}

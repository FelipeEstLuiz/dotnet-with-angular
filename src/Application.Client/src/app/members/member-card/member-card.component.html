<div class="card mb-4">
    <div class="card-img-wrapper">
        <img src="{{member().photoUrl}}" alt="{{member().knowAs}}" class="card-img-top">
    </div>
    <div class="card-body p-1">
        <h6 class="card-title text-center mb-1">
            <i class="fa fa-user me-2"></i>
            {{member().knowAs}}
        </h6>
        <p class="card-text text-center text-muted">{{member().city}} - {{member().country}}</p>
    </div>
</div>
